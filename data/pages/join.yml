  title: Prospective students
  intro: ''
  items: []
  body: |-
    **PhD and MS students.** We are recruiting graduate students through the [Department of Geography and Environmental Studies](https://geography.nmsu.edu/) for projects on land change, forests and governance in Latin America and the US Southwest. Funding is available through teaching and research assistantships.

    **Undergraduates.** Research positions in GIS, remote sensing and data visualization are open to NMSU students from any major.

    **Postdocs and visiting scholars.** We are happy to support fellowship applications (NSF, Fulbright, CONAHCYT and others).

    ### How to get in touch

    Send an email to lcalzada@nmsu.edu with the subject "Prospective student", a short note on your interests, and your CV. Writing in Spanish is welcome.
