story_label: "Our research in brief"
story_title: "Research overview"
story:
  - label: "The challenge"
    text: "Forests and farms across Latin America and the US Southwest are changing on several fronts at once. Megaprojects like the Maya Train, conservation and agroforestry programs, and hurricanes, droughts and fires all leave their mark on the same places."
  - label: "Our question"
    text: "Who decides what happens to a landscape, and who carries the consequences? When development, conservation and extreme events overlap, how do forests, farming systems and communities respond?"
  - label: "Our approach"
    text: "We combine decades of satellite imagery and spatial models, which show what changed and where, with fieldwork, interviews and participatory mapping, which explain why and for whom."
  - label: "Why it matters"
    text: "Environmental policy works on real places and real people. We share our findings in formats that communities, agencies and students can use."
