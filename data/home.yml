what_label: "What we do"
what_title: "Integrating remote sensing, land system science and interdisciplinary perspectives"
what_intro: "Landscapes record policy, markets, environmental change and everyday decisions. We connect these scales, from a 30-meter pixel to a conversation in a community assembly."
pillars:
  - name: "Observe"
    text: "We monitor landscape change with satellite time series, biomass estimates and disturbance histories, using open and reproducible workflows."
  - name: "Listen"
    text: "We examine how policies play out on the ground through fieldwork, interviews and participatory mapping, with attention to power and local perspectives."
  - name: "Co-create"
    text: "We co-produce knowledge with communities, agencies and students, and return results through bilingual reports, StoryMaps and open data."
