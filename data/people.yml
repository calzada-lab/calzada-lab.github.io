- name: "Leonardo Calzada"
  group: pi
  role: "Principal Investigator · Assistant Professor"
  photo: "/assets/img/people/leonardo-calzada.jpg"
  bio: "Human-environment geographer and land system scientist. He studies how environmental change and access to natural resources shape each other, from forest degradation and local governance in the Maya Forest to the vulnerability of fishing communities in the US Northeast. He earned a PhD in Geography at Rutgers University and an MSc and BSc in biology at the National Autonomous University of Mexico (UNAM). He is a National Geographic Explorer and a Fulbright–García Robles fellow."
  interests: "Land system science · Remote sensing · Forest dynamics · Environmental governance · Political ecology · Storytelling with maps"
