- name: "Leonardo Calzada"
  group: pi
  role: "Principal Investigator · Assistant Professor"
  photo: ""
  bio: "Human-environment geographer and land system scientist. Leo studies how environmental change and access to natural resources shape each other, from forest degradation and local governance in the Maya Forest to the vulnerability of fishing communities in the US Northeast. Before NMSU he earned a PhD in Geography at Rutgers and worked as a cartographer at CONABIO and as Deputy Director of Biosafety Communication at CIBIOGEM. He is a National Geographic Explorer and a Fulbright–García Robles fellow."
  interests: "Land system science · Remote sensing · Forest dynamics · Environmental governance · Political ecology · Storytelling with maps"
