<script>
// Topographic contour lines (marching squares over smooth noise) for .hero and .page-head canvases.
(function () {
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function noise(seed) {
    const g = [], P = 64;
    for (let i = 0; i < P * P; i++) g.push(Math.sin(i * 127.1 + seed * 311.7) * 43758.5453 % 1);
    const v = (x, y) => g[((y % P + P) % P) * P + ((x % P + P) % P)];
    const s = t => t * t * (3 - 2 * t);
    return (x, y) => {
      const xi = Math.floor(x), yi = Math.floor(y), xf = s(x - xi), yf = s(y - yi);
      const a = v(xi, yi), b = v(xi + 1, yi), c = v(xi, yi + 1), d = v(xi + 1, yi + 1);
      return a + (b - a) * xf + (c - a) * yf + (a - b - c + d) * xf * yf;
    };
  }
  document.querySelectorAll(".hero, .page-head").forEach((host, k) => {
    const cv = document.createElement("canvas");
    host.prepend(cv);
    const ctx = cv.getContext("2d");
    const n1 = noise(3 + k), n2 = noise(11 + k);
    let t = 0, W, H, dpr;
    function size() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = cv.clientWidth; H = cv.clientHeight;
      cv.width = W * dpr; cv.height = H * dpr;
    }
    function field(x, y) {
      return n1(x / 260 + t, y / 260) * 0.65 + n2(x / 110, y / 110 - t * 0.6) * 0.35;
    }
    function draw() {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, W, H);
      const step = 14, cols = Math.ceil(W / step) + 1, rows = Math.ceil(H / step) + 1;
      const f = new Float32Array(cols * rows);
      for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) f[j * cols + i] = field(i * step, j * step);
      for (let L = 0; L < 14; L++) {
        const lv = -0.6 + L * 0.09;
        ctx.strokeStyle = L % 5 === 0 ? "rgba(242,167,195,0.45)" : "rgba(160,205,185,0.32)";
        ctx.lineWidth = L % 5 === 0 ? 1.3 : 0.8;
        ctx.beginPath();
        for (let j = 0; j < rows - 1; j++) for (let i = 0; i < cols - 1; i++) {
          const a = f[j * cols + i], b = f[j * cols + i + 1], c = f[(j + 1) * cols + i + 1], d = f[(j + 1) * cols + i];
          const idx = (a > lv) | ((b > lv) << 1) | ((c > lv) << 2) | ((d > lv) << 3);
          if (idx === 0 || idx === 15) continue;
          const x = i * step, y = j * step, lerp = (p, q) => (lv - p) / (q - p);
          const T = [x + step * lerp(a, b), y], R = [x + step, y + step * lerp(b, c)];
          const B = [x + step * lerp(d, c), y + step], Lf = [x, y + step * lerp(a, d)];
          const seg = (p, q) => { ctx.moveTo(p[0], p[1]); ctx.lineTo(q[0], q[1]); };
          switch (idx) {
            case 1: case 14: seg(Lf, T); break;  case 2: case 13: seg(T, R); break;
            case 3: case 12: seg(Lf, R); break;  case 4: case 11: seg(R, B); break;
            case 6: case 9: seg(T, B); break;    case 7: case 8: seg(Lf, B); break;
            case 5: seg(Lf, T); seg(R, B); break; case 10: seg(T, R); seg(Lf, B); break;
          }
        }
        ctx.stroke();
      }
    }
    size(); draw();
    window.addEventListener("resize", () => { size(); draw(); });
    if (!reduce) {
      let last = 0;
      (function loop(ts) {
        if (ts - last > 80) { t += 0.0025; draw(); last = ts; }
        requestAnimationFrame(loop);
      })(0);
    }
  });
})();
</script>
