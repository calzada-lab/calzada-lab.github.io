        type: object
        list: true
        fields:
          - name: style
            label: Background
            type: select
            options: { values: [plain, alt, dark] }
          - { name: label, label: Small label, type: string }
          - { name: title, label: Section title, type: string }
          - { name: intro, label: Intro sentence, type: text }
          - { name: body, label: "Text (blank line = new paragraph, **bold**, [link](https://...), ### subheading)", type: text }
          - name: items
            label: Columns (title + text)
            type: object
            list: true
            fields:
              - { name: name, label: Title, type: string }
              - { name: text, label: Text, type: text }
      - { name: bold_names, label: Surnames to bold automatically in author lists, type: string, list: true }

  - name: page-news
    label: "Page text: News"
    type: file
    path: data/pages/news.yml
    fields:
      - { name: eyebrow, label: Small text above the title, type: string }
      - { name: title, label: Page title, type: string }
      - { name: intro, label: Intro paragraph, type: text }
      - { name: image, label: Header photo (optional), type: image }
      - name: sections
        label: Sections
        type: object
        list: true
        fields:
          - name: style
            label: Background
            type: select
            options: { values: [plain, alt, dark] }
          - { name: label, label: Small label, type: string }
          - { name: title, label: Section title, type: string }
          - { name: intro, label: Intro sentence, type: text }
          - { name: body, label: "Text (blank line = new paragraph, **bold**, [link](https://...), ### subheading)", type: text }
          - name: items
            label: Columns (title + text)
            type: object
